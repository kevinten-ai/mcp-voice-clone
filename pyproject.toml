[project]
name = "mcp-voice-clone"
version = "1.0.0"
description = "MCP server for voice cloning and advanced TTS. Clone voices from audio samples, generate speech with cloned voices, and create sound effects."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_clone"]

[project.scripts]
voice-clone = "voice_clone:main"
